name: Deploy web to GitHub Pages

# Builds the static web app and pushes it to the `gh-pages` branch, which
# GitHub Pages serves at https://<owner>.github.io/<repository>/ ("Deploy from
# a branch" source). The branch is created automatically on the first run.

on:
  push:
    branches: [main, claude/routines-app-scaffold-nzchih]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static web app
        # The site lives under /<repository>/ on GitHub Pages.
        run: node scripts/build-web.mjs --base "/${{ github.event.repository.name }}"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: static web build ${{ github.sha }}'
